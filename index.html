<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>俊輝電梯 — 員工報更</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang HK',sans-serif;background:#0d0f12;color:#e8eaf0;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px 40px}
.company{font-size:17px;font-weight:700;color:#f0c000;text-align:center;margin-bottom:4px}
.subtitle{font-size:12px;color:#555d6e;text-align:center;margin-bottom:24px}
.card{background:#13161c;border:1px solid #1e2330;border-radius:14px;padding:20px;width:100%;max-width:420px;margin-bottom:14px}
.badge{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding:14px;background:#0d0f12;border-radius:10px;border:1px solid #2a3045}
.avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;flex-shrink:0}
.lbl{display:block;font-size:11px;color:#9aa0b4;text-transform:uppercase;margin-bottom:6px;font-weight:600}
.inp{width:100%;background:#0d0f12;border:1px solid #2a3045;border-radius:10px;color:#e8eaf0;font-size:16px;padding:12px 14px;outline:none;-webkit-appearance:none;margin-bottom:14px}
.inp:focus{border-color:#f0c000}
.shifts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.shift{padding:14px 10px;border-radius:10px;border:2px solid #2a3045;background:transparent;color:#9aa0b4;font-size:14px;font-weight:600;cursor:pointer;text-align:center}
.shift.sel{border-color:#f0c000;background:#1a1500;color:#f0c000}
.shift-icon{font-size:20px;display:block;margin-bottom:4px}
textarea.inp{resize:none;height:80px}
.btn{width:100%;background:#f0c000;color:#0d0f12;border:none;border-radius:10px;padding:14px;font-size:16px;font-weight:800;cursor:pointer;margin-top:4px}
.btn:disabled{opacity:0.4;cursor:not-allowed}
.success{text-align:center;padding:32px 16px}
.sum{background:#0d0f12;border:1px solid #1e2330;border-radius:10px;padding:14px;margin:14px 0;text-align:left}
.row{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;border-bottom:1px solid #1e2330}
.row:last-child{border-bottom:none}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#e05c5c;color:#fff;border-radius:8px;padding:10px 20px;font-size:13px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;z-index:999}
.toast.show{opacity:1}
</style>
</head>
<body>
<div style="font-size:32px;text-align:center;margin-bottom:8px;padding-top:12px">🏗️</div>
<div class="company">俊輝電梯工程有限公司</div>
<div class="subtitle">員工自助報更</div>

<div id="err" style="display:none;text-align:center;padding:60px 20px">
  <div style="font-size:48px;margin-bottom:16px">⚠️</div>
  <div style="font-size:18px;font-weight:700;color:#e05c5c;margin-bottom:8px">連結無效</div>
  <div style="color:#555d6e;font-size:14px">請向主管索取正確嘅報更連結</div>
</div>

<div id="main" style="display:none;width:100%;max-width:420px">
  <div class="card">
    <div class="badge">
      <div class="avatar" id="av">?</div>
      <div>
        <div style="font-size:17px;font-weight:700" id="nm">載入中...</div>
        <div style="font-size:11px;color:#555d6e;margin-top:2px">電梯技工</div>
      </div>
    </div>
    <label class="lbl">日期</label>
    <input type="date" class="inp" id="dt">
    <label class="lbl">更期</label>
    <div class="shifts">
      <button class="shift" data-v="早更" onclick="sel(this)"><span class="shift-icon">🌅</span>早更</button>
      <button class="shift" data-v="夜更" onclick="sel(this)"><span class="shift-icon">🌙</span>夜更</button>
      <button class="shift" data-v="假日更" onclick="sel(this)"><span class="shift-icon">🎉</span>假日更</button>
      <button class="shift" data-v="散工" onclick="sel(this)"><span class="shift-icon">💼</span>散工</button>
    </div>
    <label class="lbl">上班時間</label>
    <input type="time" class="inp" id="tm">
    <label class="lbl">備註（可選）</label>
    <textarea class="inp" id="rmk" placeholder="例：工作內容、特別情況..."></textarea>
    <button class="btn" id="sbtn" onclick="submit()" disabled>確認報更</button>
  </div>
</div>

<div id="done" style="display:none;width:100%;max-width:420px">
  <div class="card success">
    <div style="font-size:56px;margin-bottom:12px">✅</div>
    <h2 style="font-size:20px;font-weight:800;color:#22c55e;margin-bottom:8px">報更成功！</h2>
    <div class="sum" id="sumbox"></div>
    <p style="color:#9aa0b4;font-size:13px">已記錄到系統，主管可以喺考勤月曆睇到</p>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const SB_URL='https://fyxvejnvzflxppqrhlzt.supabase.co';
const SB_KEY='sb_publishable_k9GEEEmqiYnuBPFqsQuvIQ_YGjweOSh';
const EMPLOYEES = [
  {id:26,name:"姚奇敏",phone:"52392789",color:"#FF6B1A"},
  {id:28,name:"賴偉志",phone:"91498681",color:"#22C55E"},
  {id:29,name:"韓小錦",phone:"57631557",color:"#60A5FA"},
  {id:30,name:"彭金花",phone:"93405725",color:"#A78BFA"},
  {id:31,name:"李文彪",phone:"63573726",color:"#FB923C"},
  {id:32,name:"莫家文",phone:"65704790",color:"#F43F5E"},
  {id:33,name:"陳文軒",phone:"51115103",color:"#06B6D4"},
  {id:43,name:"Simon 曾遠宗",phone:"93408961",color:"#84CC16"},
  {id:44,name:"Kim",phone:"66438119",color:"#E879F9"},
  {id:45,name:"耿華成",phone:"95615270",color:"#F0C000"},
  {id:46,name:"譚敏銳",phone:"54201997",color:"#22C55E"},
  {id:47,name:"吳紹鵬",phone:"56111810",color:"#60A5FA"},
  {id:48,name:"蔡貴明",phone:"59383172",color:"#A78BFA"},
  {id:51,name:"李國森",phone:"68908731",color:"#FB923C"},
  {id:52,name:"KK mario",phone:"96998241",color:"#FF6B1A"},
];

// Robust emp ID extraction - handles ?emp=, #emp=, %23emp=
var m = (location.search+location.hash+decodeURIComponent(location.href)).match(/emp=(\d+)/);
var emp = m ? EMPLOYEES.find(function(e){return e.id===parseInt(m[1]);}) : null;
var shift = null;

if (!emp) {
  document.getElementById('err').style.display='block';
} else {
  document.getElementById('main').style.display='block';
  document.getElementById('nm').textContent=emp.name;
  var av=document.getElementById('av');
  av.textContent=emp.name[0];
  av.style.background=emp.color+'33';
  av.style.color=emp.color;
  av.style.border='2px solid '+emp.color+'66';
  // HK date/time
  var hk=new Date(Date.now()+8*3600000);
  document.getElementById('dt').value=hk.toISOString().slice(0,10);
  document.getElementById('tm').value=hk.toISOString().slice(11,16);
}

function sel(btn){
  document.querySelectorAll('.shift').forEach(function(b){b.classList.remove('sel');});
  btn.classList.add('sel'); shift=btn.dataset.v;
  document.getElementById('sbtn').disabled=false;
}

function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2500);
}

async function submit(){
  if(!shift){toast('請選擇更期');return;}
  var btn=document.getElementById('sbtn');
  btn.disabled=true;btn.textContent='提交中...';
  var dt=document.getElementById('dt').value;
  var tm=document.getElementById('tm').value;
  var rmk=document.getElementById('rmk').value.trim();
  try{
    var r=await fetch(SB_URL+'/rest/v1/attendance',{
      method:'POST',
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify({employee_name:emp.name,date:dt,shift_type:shift,clock_in:dt+'T'+tm+':00+08:00',notes:rmk||null,status:'present'})
    });
    if(!r.ok)throw new Error();
    document.getElementById('main').style.display='none';
    document.getElementById('done').style.display='block';
    var labels={'早更':'早更','夜更':'夜更','假日更':'假日更','散工':'散工'};
    document.getElementById('sumbox').innerHTML=
      '<div class="row"><span style="color:#555d6e">姓名</span><span style="font-weight:600">'+emp.name+'</span></div>'+
      '<div class="row"><span style="color:#555d6e">日期</span><span style="font-weight:600">'+dt+'</span></div>'+
      '<div class="row"><span style="color:#555d6e">更期</span><span style="font-weight:600">'+shift+'</span></div>'+
      '<div class="row"><span style="color:#555d6e">上班時間</span><span style="font-weight:600">'+tm+'</span></div>'+
      (rmk?'<div class="row"><span style="color:#555d6e">備註</span><span style="font-weight:600">'+rmk+'</span></div>':'');
  }catch(e){
    btn.disabled=false;btn.textContent='確認報更';
    toast('提交失敗，請重試');
  }
}
</script>
</body>
</html>
